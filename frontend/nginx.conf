# Tweebyte SPA — nginx serves the Angular production build and same-origin
# reverse-proxies the API + actuator to the gateway, so the browser uses relative
# URLs (config.json baseUrl="") and there is no CORS. Stack-agnostic: the same image
# runs against whichever gateway-service (async OR reactive) shares the compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Media uploads (avatars) can be up to 10 MB — the services allow it. nginx's 1 MB
    # default would otherwise 413 the multipart POST at the edge before it reaches the gateway.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Content-hashed bundles are immutable — cache hard. index.html and the runtime
    # config must always be revalidated so a redeploy is picked up immediately.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|png|jpe?g|svg|webp|ico)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html        { add_header Cache-Control "no-cache"; }
    location = /assets/config.json { add_header Cache-Control "no-cache"; }

    # API + health → gateway (same origin → no CORS). proxy_buffering off keeps the
    # AI SSE streams (/tweet-service/.../summarize) flowing frame-by-frame, and
    # request buffering off lets multipart media uploads stream through.
    # The upstream is resolved at REQUEST time via Docker's embedded DNS (127.0.0.11)
    # + a variable, so nginx starts even if the gateway isn't up yet and survives a
    # gateway restart (a literal proxy_pass host is resolved once at startup and aborts
    # boot if it can't resolve).
    location ~ ^/(user-service|tweet-service|interaction-service|actuator)/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream_gateway gateway-service:8080;
        # The prod gateway edge is HTTPS (server.ssl.enabled, client-auth=none — it accepts
        # public callers with NO client cert; the east-west mTLS is gateway->services, not
        # browser->gateway). The dev-CA cert is self-signed, so verification is off. (A
        # plaintext-gateway profile would proxy http:// instead — the frontend rides the
        # TLS-on prod/FE compose.)
        proxy_pass https://$upstream_gateway$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        # The browser->nginx hop is SAME-ORIGIN, so strip the browser Origin: the gateway's
        # edge CORS defaults to allowed-origins=none (same-origin only) and would otherwise
        # 403 "Invalid CORS request" on the forwarded Origin. The real cross-origin guard is
        # the browser (it only issues these because they're same-origin) plus the JWT.
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — every non-asset path serves index.html for Angular's router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
