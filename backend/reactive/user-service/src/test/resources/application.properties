# W1 Vault: disabled for unit tests; these resources shadow the main file (no
# vault:// import) and carry the secret values inline so the context boots without Vault.
spring.cloud.vault.enabled=false

# Server configuration — the full-context main() boot test exercises SpringApplication.run,
# which binds a real port; port 0 picks a random free one so it never collides with a
# running stack (the user-service container otherwise holds 9091).
server.port=0
server.error.include-stacktrace=never
server.error.include-message=always

# Database configuration
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54321}/user_service_db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# W2 Keycloak: enabled so the @SpringBootTest context wires KeycloakClient +
# AuthenticationService (no benchmark profile in tests). The provider only builds a
# WebClient at boot — no network call until a token is issued — so these placeholders are
# all the context needs to start.
app.keycloak.enabled=true
app.keycloak.base-url=http://localhost:8090
app.keycloak.realm=tweebyte
app.keycloak.client-id=tweebyte-app
app.keycloak.client-secret=test-secret

# Actuator basic-auth credential — the @SpringBootTest context loads the prod-profile
# ActuatorSecurityConfig (no benchmark profile in tests), so these placeholders must
# resolve for the context to start.
app.actuator.username=actuator
app.actuator.password=changeme-actuator

app.tweet.base-url=http://localhost:9092
app.interaction.base-url=http://localhost:9093

# W7: the test context talks R2DBC only and the shared DB schema is already migrated by
# the running stack, so Flyway is disabled in tests to keep behaviour identical to before.
spring.flyway.enabled=false
