# W1 Vault: disabled for unit tests; these resources shadow the main file (no
# vault:// import) and carry the secret values inline so the context boots without Vault.
spring.cloud.vault.enabled=false

# Server configuration
server.port=${SERVER_PORT:9093}
server.error.include-stacktrace=never
server.error.include-message=always

spring.main.allow-circular-references=true

# R2DBC Database configuration
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54323}/interaction_service_db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# Actuator basic-auth credential — the @SpringBootTest context loads the prod-profile
# ActuatorSecurityConfig (no benchmark profile in tests), so these placeholders must
# resolve for the context to start.
app.actuator.username=actuator
app.actuator.password=changeme-actuator

# Client configuration
app.user.base-url=http://localhost:9091/
app.tweet.base-url=http://localhost:9092/

# Cache configuration
spring.data.redis.host=localhost
spring.data.redis.port=${CACHE_PORT:26379}
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
# Mirrors the main TTL so the cache beans' @Value placeholders resolve under
# @SpringBootTest (test resources fully shadow the main properties file).
spring.cache.redis.time-to-live=60s

# W7: the test context talks R2DBC only and the shared DB schema is already migrated by
# the running stack, so Flyway is disabled in tests to keep behaviour identical to before.
spring.flyway.enabled=false
