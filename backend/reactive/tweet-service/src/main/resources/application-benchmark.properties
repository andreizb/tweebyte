# Benchmark profile — the disable contract (security / TLS / tracing / swagger /
# resilience4j inert on the measured path) plus the measured DB-pool knob, declared here so
# the benchmarked config is explicit rather than silently inherited from application.properties.

# Resilience4j annotations stay active in prod, but the benchmark profile excludes the five
# aspect auto-configurations in spring.autoconfigure.exclude below. Their health contributors
# are disabled alongside them, so no annotation proxy or Reactor decorator reaches the
# measured path. The never-trip settings below remain as defense in depth; processTweetTokens'
# Reactor Retry bean is also absent. The
# window MUST be TIME_BASED: for COUNT_BASED, resilience4j clamps minimumNumberOfCalls to
# Math.min(min, slidingWindowSize), collapsing the unreachable 2147483647 to the base 100 and
# letting the breaker open under a 100%-failure collapse. TIME_BASED leaves the min unclamped.
resilience4j.circuitbreaker.configs.default.slidingWindowType=TIME_BASED
resilience4j.circuitbreaker.configs.default.failureRateThreshold=100
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=100
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=2147483647
# The other four aspects have no per-aspect `.enabled` switch either (verified absent from
# resilience4j-spring-boot3 2.2.0 config metadata), so each is defanged through its
# configs.default instead: single-attempt retry, unbounded bulkhead, 1h time limit,
# unbounded rate limit.
resilience4j.retry.configs.default.maxAttempts=1
resilience4j.bulkhead.configs.default.maxConcurrentCalls=2147483647
resilience4j.timelimiter.configs.default.timeoutDuration=3600s
resilience4j.ratelimiter.configs.default.limitForPeriod=2147483647
app.resilience.retry.enabled=false

# OpenAPI/Swagger off on the measured path — springdoc endpoints are prod/dev-only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Spring Security is prod-only (actuator basic-auth). Exclude its auto-configuration on
# the measured path so no security filter sits on the request — zero added cost. This
# overlay replaces the base spring.autoconfigure.exclude, so the unused Spring AI
# audio/image/embedding/etc. auto-configurations are carried forward here too.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,io.github.resilience4j.springboot3.bulkhead.autoconfigure.BulkheadAutoConfiguration,io.github.resilience4j.springboot3.retry.autoconfigure.RetryAutoConfiguration,io.github.resilience4j.springboot3.circuitbreaker.autoconfigure.CircuitBreakerAutoConfiguration,io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimiterAutoConfiguration,io.github.resilience4j.springboot3.timelimiter.autoconfigure.TimeLimiterAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.MicrometerTracingAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.OpenTelemetryAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
management.health.circuitbreakers.enabled=false
management.health.ratelimiters.enabled=false

# W3 TLS off on the measured path — no edge handshake, no encryption, no inbound
# client-auth, no outbound east-west client cert, and plaintext datastore connections.
server.ssl.enabled=false
server.ssl.client-auth=none
app.mtls.enabled=false
spring.r2dbc.properties.sslMode=DISABLE

# DB connection pool — auto-grows from min-idle to max-size on demand; sized so the pool is
# never the bottleneck (reactive uses ~tens via per-query release, async climbs toward max).
# max-acquire-time is effectively infinite so saturation queues instead of erroring (0% errors).
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.min-idle=10
spring.r2dbc.pool.max-size=256
spring.r2dbc.pool.max-acquire-time=3600s

# Reactive DB colocation fix — fan connection work across all event-loop workers instead of
# pinning to 1-2 (the documented reactor-pool serialization behind the conc=100 plateau).
app.r2dbc.disable-colocation=true

# Move r2dbc-pool acquire/release off the Netty event loops onto a dedicated parallel
# scheduler. The JFR-measured binding cost is the acquire handoff (not the sub-ms queries),
# which is what caps reactive throughput from ~conc 100. Bean is @ConditionalOnProperty-gated.
app.r2dbc.pool.acquisition-scheduler.enabled=true

# Downstream HTTP acquire wait -> effectively infinite on the measured path (wait, don't fail).
app.http.downstream.acquire-timeout-seconds=3600
spring.data.redis.ssl.enabled=false

# Distributed tracing off (profile-gated): zero span overhead on the measured path.
management.tracing.enabled=false
