# Server configuration
server.port=${SERVER_PORT:9092}
server.error.include-message=never
# Graceful shutdown: drain in-flight requests on SIGTERM before the JVM exits.
# Bench-neutral — only changes shutdown behaviour, not steady-state request handling.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# W1 Vault: every secret (R2DBC + Flyway DB passwords, actuator password, LLM API
# key) is fetched from Vault KV (secret/tweebyte) at boot.
# The import is non-optional and the token has no default, so the app fails fast if
# Vault is unreachable or VAULT_TOKEN is unset. Boot-time only: secrets land in the
# Environment once at startup and nothing here touches the measured request path.
# Static KV — lifecycle management off, so the JVM runs no Vault background threads.
spring.config.import=vault://secret/tweebyte
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.config.lifecycle.enabled=false

# R2DBC Database configuration
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54322}/tweet_service_db
spring.r2dbc.username=postgres
# spring.r2dbc.password supplied by Vault (secret/tweebyte).
# W3: verify the Postgres server cert chains to our dev CA on the runtime R2DBC
# connection (prod / functional-equivalence). The benchmark overlay sets sslMode=DISABLE.
spring.r2dbc.properties.sslMode=VERIFY_CA
spring.r2dbc.properties.sslRootCert=/etc/tweebyte/tls/ca.crt

# W7 Flyway: the reactive runtime is R2DBC-only, so Flyway gets its own boot-only JDBC
# datasource (HikariCP) to apply the versioned baseline at boot, then goes idle. The V1
# checksum is identical to the async copy; because async usually boots first against the
# shared physical DB, this stack typically reports "schema is up to date".
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54322}/tweet_service_db
spring.flyway.user=postgres
# spring.flyway.password supplied by Vault (secret/tweebyte).
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# W3 TLS (Spring Boot SSL bundle). The per-service PKCS12 keystore is BOTH this
# service's edge/server identity and its east-west mTLS client identity; the shared
# truststore holds the dev CA every peer chains to. Cert material is compose-mounted
# at /etc/tweebyte/tls (never baked into the image); the keystore + truststore
# passwords come from Vault (secret/tweebyte). Prod / functional-equivalence serve TLS
# and require a client cert on inbound east-west calls; the benchmark overlay turns
# every SSL surface off, so the measured path carries no handshake cost.
spring.ssl.bundle.jks.tweebyte.keystore.location=file:/etc/tweebyte/tls/tweet-service.p12
spring.ssl.bundle.jks.tweebyte.keystore.type=PKCS12
spring.ssl.bundle.jks.tweebyte.truststore.location=file:/etc/tweebyte/tls/truststore.p12
spring.ssl.bundle.jks.tweebyte.truststore.type=PKCS12
server.ssl.enabled=true
server.ssl.bundle=tweebyte
server.ssl.client-auth=need
# Gate read by ReactivePoolConfiguration: present this service's client cert + trust the
# CA on outbound east-west calls. ON in prod, OFF in the benchmark overlay.
app.mtls.enabled=true

# AI configuration
# We only use Spring AI's chat surface — exclude unused audio/image/embedding/etc.
# auto-configurations so they don't try to instantiate beans (and demand an API key)
# under mock backend or in tests.
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
app.ai.backend=${AI_BACKEND:mock}
app.ai.mock.ttft-mean-ms=${AI_MOCK_TTFT_MEAN_MS:250}
app.ai.mock.ttft-log-sigma=${AI_MOCK_TTFT_LOG_SIGMA:0.4}
app.ai.mock.itl-mean-ms=${AI_MOCK_ITL_MEAN_MS:40}
app.ai.mock.itl-gamma-shape=${AI_MOCK_ITL_GAMMA_SHAPE:2.5}
app.ai.mock.itl-p-burst=${AI_MOCK_ITL_P_BURST:0.0}
app.ai.mock.tokens-per-response=${AI_MOCK_TOKENS_PER_RESPONSE:150}
app.ai.mock.calibration-json=${AI_MOCK_CALIBRATION_JSON:}
# Live-LLM backend connection (used when app.ai.backend != mock).
# Default port 1234 matches LM Studio's default OpenAI-API server; for
# mlx_lm.server override with LIVE_LLM_BASE_URL=http://localhost:8081 when
# this app and the model server both run host-local. A containerized app can
# reach a host model server through host.docker.internal when explicitly selected.
# Default model identifier "qwen3.5-4b-mlx" matches the calibration source;
# override LIVE_LLM_MODEL for any other model.
spring.ai.openai.base-url=${LIVE_LLM_BASE_URL:http://localhost:1234}
# spring.ai.openai.api-key supplied by Vault (secret/tweebyte).
spring.ai.openai.chat.options.model=${LIVE_LLM_MODEL:qwen3.5-4b-mlx}
spring.ai.openai.chat.options.temperature=${LIVE_LLM_TEMPERATURE:0.7}
# Cap response length so per-request service time stays under the live
# backend's sustainable throughput ceiling. With Qwen3.5-4B-MLX-4bit on
# Apple Silicon (~3 s/200-token response under continuous batching of 8),
# max-tokens=200 keeps rps=1 cells comfortably below the queue-buildup
# regime described in §5.13.
spring.ai.openai.chat.options.max-tokens=${LIVE_LLM_MAX_TOKENS:200}

# Cache configuration
spring.data.redis.host=${CACHE_HOST:localhost}
spring.data.redis.port=${CACHE_PORT:63790}
spring.data.redis.repositories.enabled=false
# W3: encrypt the Redis connection and verify the server cert against the dev CA in
# the shared bundle (prod / functional-equivalence). The benchmark overlay sets
# spring.data.redis.ssl.enabled=false so the measured path carries no handshake cost.
spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.bundle=tweebyte
# Lettuce connection pool — sized to the IO/cache concurrency it backs (= ioExecutor 256),
# restoring the codebase invariant 'every blocking thread pool is backed by an equal connection
# pool'. On the blocking stack a LettuceConnectionFactory customizer sets shareNativeConnection
# =false so blocking RedisTemplate ops draw dedicated pooled connections; the reactive stack
# multiplexes over its shared connection (this pool stays inert there), so both stacks declare
# the same Redis budget and each uses it in its model-appropriate way.
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=256
spring.data.redis.lettuce.pool.max-idle=256
spring.data.redis.lettuce.pool.min-idle=16
spring.data.redis.lettuce.pool.max-wait=3600s

# Client configuration
app.user.base-url=${USER_SERVICE_URL:http://localhost:9091/}
app.interaction.base-url=${INTERACTION_SERVICE_URL:http://localhost:9093/}

# DB pool size is a measured benchmark knob — set in application-benchmark.properties, not
# here, so prod / functional-equivalence run the framework default.

# Downstream HTTP fan-out pool (Reactor Netty ConnectionProvider) — pinned explicitly and
# symmetric with the async HttpClient 5 pool. Framework defaults are unusable here (Netty 500
# per host vs HC5 5 per route — asymmetric), so both stacks declare the same value. The acquire
# timeout matches Netty's own 45s default; the benchmark overlay raises it to effectively-infinite.
app.http.downstream.max-connections=256
app.http.downstream.pending-acquire-max-count=-1
app.http.downstream.acquire-timeout-seconds=45
# Response/read timeout safety net (symmetric both stacks): caps a pathological slow
# downstream so a stalled call frees its pooled connection. Far above any healthy-cell
# latency, so it must NOT fire in a clean run (the 0%-errors bar). Sized under the
# server async/request timeout.
app.http.downstream.response-timeout-seconds=28

# Netty server tuning is off by default (nettyFactory is gated behind
# app.netty.server.enabled=true). Enable it only if reproduction proves it needed.

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=prometheus,health,info,metrics,circuitbreakers
# Actuator basic-auth credential (prod / functional-equivalence only). The password
# is supplied by Vault (secret/tweebyte); the benchmark profile excludes Spring
# Security entirely, so this credential is never consulted on the measured path.
app.actuator.username=${ACTUATOR_USERNAME:actuator}
spring.application.name=tweet-service
# Distributed tracing: profile-gated (not env-gated). ON in prod / functional-equivalence;
# the benchmark overlay flips it to false so the measured path carries zero span overhead.
management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# OpenAPI / Swagger UI — on in prod & functional-equivalence; the benchmark overlay
# turns it off (off the measured path). Spec build is on-demand, not at boot.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

resilience4j.circuitbreaker.configs.default.slidingWindowSize=100
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=10
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
# Treat business-domain "not found" as terminal: it must not count toward the failure rate or trip the breaker (matches the retry ignoreExceptions).
resilience4j.circuitbreaker.configs.default.ignoreExceptions=ro.tweebyte.tweetservice.exception.UserNotFoundException,ro.tweebyte.tweetservice.exception.TweetNotFoundException
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.followedIdsCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.followedIdsCircuitBreaker.waitDurationInOpenState=5000

# Resilience4j inter-service client guards (W6). CircuitBreaker + Retry(backoff) +
# Bulkhead + TimeLimiter wrap every UserClient/InteractionClient call, identical
# async <-> reactive. One instance per client class. Benchmark mode flips every
# aspect off (see application-benchmark.properties), so cost on the measured path
# is provably zero.
resilience4j.circuitbreaker.instances.userClient.baseConfig=default
resilience4j.circuitbreaker.instances.interactionClient.baseConfig=default
# Retry: 3 attempts, 200ms base with exponential backoff (x2). 5xx/transport faults
# retry; the domain not-found exceptions are ignored so 4xx never retries.
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=200ms
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2
resilience4j.retry.configs.default.retryExceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError,org.springframework.web.reactive.function.client.WebClientResponseException$BadGateway,org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable,org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout,org.springframework.web.reactive.function.client.WebClientResponseException$NotImplemented
resilience4j.retry.configs.default.ignoreExceptions=ro.tweebyte.tweetservice.exception.UserNotFoundException,ro.tweebyte.tweetservice.exception.TweetNotFoundException
resilience4j.retry.instances.userClient.baseConfig=default
resilience4j.retry.instances.interactionClient.baseConfig=default
# Bulkhead: 200 concurrent calls, 45s acquire wait — symmetric with the 200 HTTP
# pool + 45s acquire timeout.
resilience4j.bulkhead.configs.default.maxConcurrentCalls=200
resilience4j.bulkhead.configs.default.maxWaitDuration=45s
resilience4j.bulkhead.instances.userClient.baseConfig=default
resilience4j.bulkhead.instances.interactionClient.baseConfig=default
# TimeLimiter: 45s ceiling, cancel the running future on timeout.
resilience4j.timelimiter.configs.default.timeoutDuration=45s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true
resilience4j.timelimiter.instances.userClient.baseConfig=default
resilience4j.timelimiter.instances.interactionClient.baseConfig=default
