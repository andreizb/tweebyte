# Server Configuration
spring.application.name=gateway-service
server.port=${SERVER_PORT:8080}
# Graceful shutdown: drain in-flight requests on SIGTERM before the JVM exits.
# Bench-neutral — gateway sits off the benchmark path; only changes shutdown behaviour.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# W1 Vault: the TLS keystore/truststore passwords are fetched from Vault KV
# (secret/tweebyte) at boot. The import is non-optional and the token has no default, so
# the app fails fast if Vault is unreachable or VAULT_TOKEN is unset. Boot-time only: the
# secrets land in the Environment once at startup and nothing here touches the proxied
# request path. Static KV — lifecycle management off, so the JVM runs no Vault
# background threads.
spring.config.import=vault://secret/tweebyte
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.config.lifecycle.enabled=false

# Spring Cloud Gateway Configuration.
# Cookie/Set-Cookie are stripped on forward to mirror the async gateway's
# header handling; Authorization is forwarded on both stacks. Each route adds a
# Redis-backed RequestRateLimiter token bucket keyed by JWT subject (gatewayKeyResolver).
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:9091/}
spring.cloud.gateway.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1]=RemoveRequestHeader=Cookie
spring.cloud.gateway.routes[0].filters[2]=RemoveResponseHeader=Set-Cookie
spring.cloud.gateway.routes[0].filters[3].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[3].args.key-resolver=#{@gatewayKeyResolver}
spring.cloud.gateway.routes[0].filters[3].args.redis-rate-limiter.replenishRate=${app.gateway.rate-limit.replenish-rate}
spring.cloud.gateway.routes[0].filters[3].args.redis-rate-limiter.burstCapacity=${app.gateway.rate-limit.burst-capacity}
spring.cloud.gateway.routes[0].filters[3].args.redis-rate-limiter.requestedTokens=${app.gateway.rate-limit.requested-tokens}

spring.cloud.gateway.routes[1].id=tweet-service
spring.cloud.gateway.routes[1].uri=${TWEET_SERVICE_URL:http://localhost:9092/}
spring.cloud.gateway.routes[1].predicates[0]=Path=/tweet-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1]=RemoveRequestHeader=Cookie
spring.cloud.gateway.routes[1].filters[2]=RemoveResponseHeader=Set-Cookie
spring.cloud.gateway.routes[1].filters[3].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[3].args.key-resolver=#{@gatewayKeyResolver}
spring.cloud.gateway.routes[1].filters[3].args.redis-rate-limiter.replenishRate=${app.gateway.rate-limit.replenish-rate}
spring.cloud.gateway.routes[1].filters[3].args.redis-rate-limiter.burstCapacity=${app.gateway.rate-limit.burst-capacity}
spring.cloud.gateway.routes[1].filters[3].args.redis-rate-limiter.requestedTokens=${app.gateway.rate-limit.requested-tokens}

spring.cloud.gateway.routes[2].id=interaction-service
spring.cloud.gateway.routes[2].uri=${INTERACTION_SERVICE_URL:http://localhost:9093/}
spring.cloud.gateway.routes[2].predicates[0]=Path=/interaction-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[1]=RemoveRequestHeader=Cookie
spring.cloud.gateway.routes[2].filters[2]=RemoveResponseHeader=Set-Cookie
spring.cloud.gateway.routes[2].filters[3].name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[3].args.key-resolver=#{@gatewayKeyResolver}
spring.cloud.gateway.routes[2].filters[3].args.redis-rate-limiter.replenishRate=${app.gateway.rate-limit.replenish-rate}
spring.cloud.gateway.routes[2].filters[3].args.redis-rate-limiter.burstCapacity=${app.gateway.rate-limit.burst-capacity}
spring.cloud.gateway.routes[2].filters[3].args.redis-rate-limiter.requestedTokens=${app.gateway.rate-limit.requested-tokens}

# Edge rate limit (token bucket). Defaults are generous for a north-south front door;
# replenish-rate = steady tokens/sec, burst-capacity = bucket depth, requested-tokens = cost/request.
app.gateway.rate-limit.replenish-rate=${GATEWAY_RATE_LIMIT_REPLENISH:200}
app.gateway.rate-limit.burst-capacity=${GATEWAY_RATE_LIMIT_BURST:400}
app.gateway.rate-limit.requested-tokens=${GATEWAY_RATE_LIMIT_TOKENS:1}

# Redis backing the RedisRateLimiter (mirrors the services' CACHE_HOST/CACHE_PORT shape).
# The Lettuce factory is lazy, so the test context loads without a live Redis.
spring.data.redis.host=${CACHE_HOST:localhost}
spring.data.redis.port=${CACHE_PORT:6380}
spring.data.redis.repositories.enabled=false
# W3 TLS: the edge RedisRateLimiter speaks TLS to Redis (port 6380), same as the
# services — the gateway already trusts the dev CA via the tweebyte bundle. The gateway
# is off the benchmark path (load tests bypass it), so this carries zero benchmark cost.
spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.bundle=tweebyte

# Security response headers on every proxied response: HSTS, CSP, X-Content-Type-Options,
# X-Frame-Options, Referrer-Policy. Applied as a default filter so all routes inherit it.
spring.cloud.gateway.default-filters[0]=SecureHeaders
spring.cloud.gateway.filter.secure-headers.strict-transport-security=max-age=31536000; includeSubDomains
spring.cloud.gateway.filter.secure-headers.content-security-policy=default-src 'self'; frame-ancestors 'none'
spring.cloud.gateway.filter.secure-headers.content-type-options=nosniff
spring.cloud.gateway.filter.secure-headers.frame-options=DENY
spring.cloud.gateway.filter.secure-headers.referrer-policy=no-referrer

# CORS at the edge: allowed origins are env-overridable; default to none (same-origin only).
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Request-size limit: reject oversized bodies at the edge before they reach a service.
spring.codec.max-in-memory-size=${GATEWAY_MAX_REQUEST_SIZE:10MB}

# Outbound HTTP pool: SCG proxies through one shared Reactor Netty connection pool.
# Sized symmetric with the per-service downstream provider (max-connections=200 per host)
# and the async gateway. acquire-timeout=45s matches the per-service
# pendingAcquireTimeout / HC5 connection-request timeout so a starved gateway caller
# fails the same way as a starved service caller.
spring.cloud.gateway.httpclient.pool.type=fixed
spring.cloud.gateway.httpclient.pool.max-connections=200
spring.cloud.gateway.httpclient.pool.acquire-timeout=45000

# W2 Keycloak: the edge validates incoming bearer tokens against the realm's JWKS.
# issuer-uri is checked into every verified token; jwks-uri is where the RS256 signing
# keys are fetched (cached, by kid). KEYCLOAK_BASE_URI is the in-network IdP address on
# prod / functional-equivalence (compose default localhost:8090 is the host-published
# port for local runs). The gateway sits off the benchmark path, so there is no overlay
# and no app.keycloak.enabled gate — token validation is always on here.
app.keycloak.issuer-uri=${KEYCLOAK_BASE_URI:http://localhost:8090}/realms/tweebyte
app.keycloak.jwks-uri=${KEYCLOAK_BASE_URI:http://localhost:8090}/realms/tweebyte/protocol/openid-connect/certs

# W3 TLS (Spring Boot SSL bundle). The gateway's PKCS12 keystore is BOTH its edge/server
# identity (north-south HTTPS) and its east-west mTLS client identity on the outbound proxy
# hop to the backend services (which require a client cert); the shared truststore holds the
# dev CA every peer chains to. Cert material is compose-mounted at /etc/tweebyte/tls (never
# baked into the image); the keystore + truststore passwords come from Vault (secret/tweebyte).
# The edge accepts public callers, so no inbound client cert is required (client-auth=none).
# The gateway has no benchmark overlay — it sits off the measured path (load tests hit the
# services directly), so TLS stays on here with zero neutrality concern.
spring.ssl.bundle.jks.tweebyte.keystore.location=file:/etc/tweebyte/tls/gateway-service.p12
spring.ssl.bundle.jks.tweebyte.keystore.type=PKCS12
spring.ssl.bundle.jks.tweebyte.truststore.location=file:/etc/tweebyte/tls/truststore.p12
spring.ssl.bundle.jks.tweebyte.truststore.type=PKCS12
server.ssl.enabled=true
server.ssl.bundle=tweebyte
server.ssl.client-auth=none
# Gate read by HttpClientMtlsConfiguration: present this gateway's client cert + trust the CA
# on SCG's outbound proxy hop so every downstream call satisfies the backend's client-auth=need.
app.mtls.enabled=true

management.endpoints.web.exposure.include=prometheus,health,info
# Distributed tracing: ON in prod / functional-equivalence. The gateway sits off the benchmark
# path, so there is no overlay to flip it off — zero neutrality concern.
management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Unified Swagger portal: aggregate the three downstream service specs, fetched through
# the gateway routes. The JWT filter whitelists these doc paths so they load unauthenticated.
springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=tweet-service
springdoc.swagger-ui.urls[1].url=/tweet-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=interaction-service
springdoc.swagger-ui.urls[2].url=/interaction-service/v3/api-docs
