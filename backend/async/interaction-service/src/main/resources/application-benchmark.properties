# Benchmark profile — the disable contract (security / TLS / tracing / swagger /
# resilience4j inert on the measured path) plus the measured DB-pool knob, declared here so
# the benchmarked config is explicit rather than silently inherited from application.properties.

# Resilience4j annotations stay active in prod, but the benchmark profile excludes the five
# aspect auto-configurations in spring.autoconfigure.exclude below. Their health contributors
# are disabled alongside them, so no annotation proxy reaches the measured path. The
# never-trip settings below remain as defense in depth. CleanupService is not instantiated. The
# window MUST be TIME_BASED: for COUNT_BASED, resilience4j clamps minimumNumberOfCalls to
# Math.min(min, slidingWindowSize), collapsing the unreachable 2147483647 to the base 100 and
# letting the breaker open under a 100%-failure collapse. TIME_BASED leaves the min unclamped.
resilience4j.circuitbreaker.configs.default.slidingWindowType=TIME_BASED
resilience4j.circuitbreaker.configs.default.failureRateThreshold=100
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=100
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=2147483647
# The other four aspects have no per-aspect `.enabled` switch either (verified absent from
# resilience4j-spring-boot3 2.2.0 config metadata), so each is defanged through its
# configs.default instead: single-attempt retry, unbounded bulkhead, 1h time limit,
# unbounded rate limit.
resilience4j.retry.configs.default.maxAttempts=1
resilience4j.bulkhead.configs.default.maxConcurrentCalls=2147483647
resilience4j.timelimiter.configs.default.timeoutDuration=3600s
resilience4j.ratelimiter.configs.default.limitForPeriod=2147483647
app.cleanup.enabled=false

# OpenAPI/Swagger off on the measured path — springdoc endpoints are prod/dev-only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Spring Security is prod-only (actuator basic-auth). Exclude its auto-configuration on
# the measured path so no security filter sits on the request — zero added cost.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration,io.github.resilience4j.springboot3.bulkhead.autoconfigure.BulkheadAutoConfiguration,io.github.resilience4j.springboot3.retry.autoconfigure.RetryAutoConfiguration,io.github.resilience4j.springboot3.circuitbreaker.autoconfigure.CircuitBreakerAutoConfiguration,io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimiterAutoConfiguration,io.github.resilience4j.springboot3.timelimiter.autoconfigure.TimeLimiterAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.MicrometerTracingAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.OpenTelemetryAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
management.health.circuitbreakers.enabled=false
management.health.ratelimiters.enabled=false

# W3 TLS off on the measured path — no edge handshake, no encryption, no inbound
# client-auth, no outbound east-west client cert, and plaintext datastore connections.
server.ssl.enabled=false
server.ssl.client-auth=none
app.mtls.enabled=false
spring.datasource.hikari.data-source-properties.sslmode=disable

# DB connection pool — Hikari grows from minimum-idle to maximum-pool-size on demand; sized so
# the pool is never the bottleneck. connection-timeout is effectively infinite so a thread
# waiting for a connection queues instead of erroring (0% errors).
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=256
spring.datasource.hikari.connection-timeout=3600000

# Downstream HTTP acquire wait -> effectively infinite on the measured path (wait, don't fail).
app.http.downstream.acquire-timeout-seconds=3600
spring.data.redis.ssl.enabled=false

# Distributed tracing off (profile-gated): zero span overhead on the measured path.
management.tracing.enabled=false

# Servlet connector admission headroom — CANONICAL benchmark posture for every async service
# under the benchmark profile (one benchmark personality, NOT per-workload tuning). Raises the
# servlet listen backlog above Spring Boot's Tomcat defaults (accept-count=100,
# max-connections=8192) so the connector accept path is never the binding admission constraint
# under sustained open-loop load — keeping the measured ceiling the application, not the socket
# accept queue. Requires the host prerequisite kern.ipc.somaxconn>=4096 (see AGENTS.md), which
# otherwise caps the effective backlog. threads.max stays at the Spring Boot default (200).
# The same connector posture applies to every benchmark workload.
server.tomcat.accept-count=4096
server.tomcat.max-connections=16384
