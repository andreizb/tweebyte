# Benchmark profile — the disable contract (security / TLS / tracing / swagger / resilience4j
# inert on the measured path) + the measured DB-pool knob, declared here rather than inherited,
# plus the AI-SSE reject-policy methodology choice below.

# Resilience4j annotations stay active in prod, but the benchmark profile excludes the five
# aspect auto-configurations in spring.autoconfigure.exclude below. Their health contributors
# are disabled alongside them, so no annotation proxy reaches the measured path. The
# never-trip settings below remain as defense in depth. The
# window MUST be TIME_BASED: for COUNT_BASED, resilience4j clamps minimumNumberOfCalls to
# Math.min(min, slidingWindowSize), collapsing the unreachable 2147483647 to the base 100 and
# letting the breaker open under a 100%-failure collapse. TIME_BASED leaves the min unclamped.
resilience4j.circuitbreaker.configs.default.slidingWindowType=TIME_BASED
resilience4j.circuitbreaker.configs.default.failureRateThreshold=100
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=100
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=2147483647
# The other four aspects have no per-aspect `.enabled` switch either (verified absent from
# resilience4j-spring-boot3 2.2.0 config metadata), so each is defanged through its
# configs.default instead: single-attempt retry, unbounded bulkhead, 1h time limit,
# unbounded rate limit.
resilience4j.retry.configs.default.maxAttempts=1
resilience4j.bulkhead.configs.default.maxConcurrentCalls=2147483647
resilience4j.timelimiter.configs.default.timeoutDuration=3600s
resilience4j.ratelimiter.configs.default.limitForPeriod=2147483647

# processTweetTokens retry loop collapsed to a single attempt (mirrors reactive,
# whose Retry bean is not registered under this profile).
app.resilience.retry.enabled=false

# streamExecutor (AI SSE) reject policy — `abort` surfaces saturation as a clean
# 5xx instead of hanging the SSE client. This is AI-benchmark methodology, not
# perf tuning; ioExecutor (DB CRUD) is a fixed pool sized to the Hikari pool and never rejects.
app.concurrency.stream.reject-policy=abort

# OpenAPI/Swagger off on the measured path — springdoc endpoints are prod/dev-only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Spring Security is prod-only (actuator basic-auth). Exclude its auto-configuration on
# the measured path so no security filter sits on the request — zero added cost. This
# key is profile-scoped and replaces (does not append to) the base AI exclusions, so the
# five unused OpenAI auto-configs from application.properties are restated here to keep
# the mock AI backend from demanding an API key under this profile.
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration,io.github.resilience4j.springboot3.bulkhead.autoconfigure.BulkheadAutoConfiguration,io.github.resilience4j.springboot3.retry.autoconfigure.RetryAutoConfiguration,io.github.resilience4j.springboot3.circuitbreaker.autoconfigure.CircuitBreakerAutoConfiguration,io.github.resilience4j.springboot3.ratelimiter.autoconfigure.RateLimiterAutoConfiguration,io.github.resilience4j.springboot3.timelimiter.autoconfigure.TimeLimiterAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.MicrometerTracingAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.OpenTelemetryAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
management.health.circuitbreakers.enabled=false
management.health.ratelimiters.enabled=false

# W3 TLS off on the measured path — no edge handshake, no encryption, no inbound
# client-auth, no outbound east-west client cert, and plaintext datastore connections.
server.ssl.enabled=false
server.ssl.client-auth=none
app.mtls.enabled=false
spring.datasource.hikari.data-source-properties.sslmode=disable

# DB connection pool — Hikari grows from minimum-idle to maximum-pool-size on demand; sized so
# the pool is never the bottleneck. connection-timeout is effectively infinite so a thread
# waiting for a connection queues instead of erroring (0% errors).
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=256
spring.datasource.hikari.connection-timeout=3600000

# Downstream HTTP acquire wait -> effectively infinite on the measured path (wait, don't fail).
app.http.downstream.acquire-timeout-seconds=3600
spring.data.redis.ssl.enabled=false

# Distributed tracing off (profile-gated): zero span overhead on the measured path.
management.tracing.enabled=false

# Servlet connector admission headroom — CANONICAL benchmark posture for every async service
# under the benchmark profile (NOT an AI-only knob, NOT per-workload). Spring Boot's Tomcat
# defaults (accept-count=100, max-connections=8192) cap the listen backlog far below what
# long-residency streaming benchmarks need: under sustained open-loop arrival the ~100-deep
# accept backlog overflows and the kernel drops SYNs (k6 logs `dial: i/o timeout`), so the
# CONNECTOR — not the bounded streamExecutor — becomes the binding constraint and contaminates
# the H1 measurement. Raising the backlog keeps admission off the critical path so the measured
# ceiling stays the streamExecutor. Requires the host listen-backlog prerequisite
# kern.ipc.somaxconn>=4096 (see AGENTS.md), which otherwise caps the effective backlog.
# threads.max is deliberately left at the Spring Boot default (200): the request thread only
# enters the controller to submit/return the SseEmitter, so the bounded streamExecutor — not the
# Tomcat worker pool — must remain the measured surface. Reactive/Netty needs no
# matching knob — it shows zero transport errors at the same somaxconn.
server.tomcat.accept-count=4096
server.tomcat.max-connections=16384
