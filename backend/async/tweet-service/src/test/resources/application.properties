# W1 Vault: disabled for unit tests; these resources shadow the main file (no
# vault:// import) and carry the secret values inline so the context boots without Vault.
spring.cloud.vault.enabled=false

# Server configuration
server.error.include-stacktrace=never
server.error.include-message=always

# Database configuration
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Mirrors the main actuator credential so ActuatorSecurityConfig's @Value placeholders
# resolve under @SpringBootTest (test resources fully shadow the main properties file).
app.actuator.username=actuator
app.actuator.password=changeme-actuator

# Cache configuration
spring.data.redis.host=localhost
spring.data.redis.port=${CACHE_PORT:63790}

# Client configuration
app.user.base-url=http://localhost:9091/
app.interaction.base-url=http://localhost:9093/

# AI configuration (mock backend; mirror main exclusions so context loads in tests
# without requiring a real OpenAI key for unrelated audio/image autoconfig beans).
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
app.ai.backend=mock
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:1234

# W7: tests run on in-memory H2; the Postgres-specific V1 baseline (BYTEA/decode) would
# fail there, so Flyway is disabled and the H2 schema stays as the tests configure it.
spring.flyway.enabled=false
