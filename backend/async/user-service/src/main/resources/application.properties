# Server configuration
server.port=${SERVER_PORT:9091}
server.error.include-message=never
# Graceful shutdown: drain in-flight requests on SIGTERM before the JVM exits.
# Bench-neutral — only changes shutdown behaviour, not steady-state request handling.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# W1 Vault: every secret (DB password, Keycloak client secret, actuator password) is
# fetched from Vault KV (secret/tweebyte) at boot. The import is
# non-optional and the token has no default, so the app fails fast if Vault is
# unreachable or VAULT_TOKEN is unset. Boot-time only: secrets land in the
# Environment once at startup and nothing here touches the measured request path.
# Static KV — lifecycle management off, so the JVM runs no Vault background threads.
spring.config.import=vault://secret/tweebyte
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.config.lifecycle.enabled=false

# Database configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54321}/user_service_db
spring.datasource.username=postgres
# spring.datasource.password supplied by Vault (secret/tweebyte).
# DB pool size is a measured benchmark knob — set in application-benchmark.properties, not
# here, so prod / functional-equivalence run the framework default.

# Downstream HTTP fan-out pool (Apache HttpClient 5) — pinned explicitly and symmetric with the
# reactive Reactor Netty pool. Framework defaults are unusable here (HC5 5 per route vs Netty
# 500 per host — asymmetric), so both stacks declare the same value. The acquire timeout matches
# Netty's 45s default; the benchmark overlay raises it to effectively-infinite. Blocking
# executors are sized to the connections they feed (a thread with no connection is waste):
# ioExecutor = DB pool, httpClientExecutor = total HTTP connections (2 routes x max-connections).
app.http.downstream.max-connections=256
app.http.downstream.max-connections-total=512
app.http.downstream.acquire-timeout-seconds=45
# Response/read timeout safety net (symmetric both stacks): caps a pathological slow
# downstream so a stalled call frees its pooled connection. Far above any healthy-cell
# latency, so it must NOT fire in a clean run (the 0%-errors bar). Sized under the
# server async/request timeout.
app.http.downstream.response-timeout-seconds=28
app.concurrency.io.pool-size=256
app.concurrency.http-client.pool-size=512
# W3: verify the Postgres server cert chains to our dev CA on the runtime JDBC
# connection (prod / functional-equivalence). The benchmark overlay sets sslmode=disable.
spring.datasource.hikari.data-source-properties.sslmode=verify-ca
spring.datasource.hikari.data-source-properties.sslrootcert=/etc/tweebyte/tls/ca.crt

# Hibernate configuration. Schema is owned by Flyway (V1__baseline.sql, applied at
# service boot); Hibernate only validates the mapping against it, never alters it.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# W7 Flyway: apply the versioned baseline at boot (before ddl-auto=validate) over the
# JDBC datasource above. Identical V1 checksum across both stacks; never baselines an
# existing non-empty schema, so a stack that boots second sees "schema is up to date".
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# W2 Keycloak: token issuance moves from in-app RSA signing to the realm. The
# AuthenticationService/Controller/KeycloakClient beans are gated on this flag; the
# benchmark overlay flips it false (no /auth surface, no Keycloak bean — users are
# seeded via SQL and never log in). client-secret is supplied by Vault (secret/tweebyte).
app.keycloak.enabled=true
app.keycloak.base-url=${KEYCLOAK_BASE_URI:http://localhost:8090}
app.keycloak.realm=tweebyte
app.keycloak.client-id=tweebyte-app
# app.keycloak.client-secret supplied by Vault (secret/tweebyte).

# W3 TLS (Spring Boot SSL bundle). The per-service PKCS12 keystore is BOTH this
# service's edge/server identity and its east-west mTLS client identity; the shared
# truststore holds the dev CA every peer chains to. Cert material is compose-mounted
# at /etc/tweebyte/tls (never baked into the image); the keystore + truststore
# passwords come from Vault (secret/tweebyte). Prod / functional-equivalence serve TLS
# and require a client cert on inbound east-west calls; the benchmark overlay turns
# every SSL surface off, so the measured path carries no handshake cost.
spring.ssl.bundle.jks.tweebyte.keystore.location=file:/etc/tweebyte/tls/user-service.p12
spring.ssl.bundle.jks.tweebyte.keystore.type=PKCS12
spring.ssl.bundle.jks.tweebyte.truststore.location=file:/etc/tweebyte/tls/truststore.p12
spring.ssl.bundle.jks.tweebyte.truststore.type=PKCS12
server.ssl.enabled=true
server.ssl.bundle=tweebyte
server.ssl.client-auth=need
# Gate read by HttpClientConfiguration: present this service's client cert + trust the
# CA on outbound east-west calls. ON in prod, OFF in the benchmark overlay.
app.mtls.enabled=true

# Thread pools are defined by nature in ThreadConfiguration (ioExecutor for
# blocking JDBC, cpuExecutor for the image-upload filter) and MvcAsyncConfig
# (streamExecutor for the file-download stream). No custom-thread-pool toggle:
# blocking JDBC always uses the unbounded cached ioExecutor (commonPool would cap
# throughput at ~NCPU).

app.tweet.base-url=${TWEET_SERVICE_URL:http://localhost:9092/}
app.interaction.base-url=${INTERACTION_SERVICE_URL:http://localhost:9093/}

# Multipart upload cap — register/update accept a profile picture. 10MB matches
# tweet-service and reactive so every upload surface rejects oversized files
# identically. file-size-threshold=10MB holds parts in memory up to the cap
# (the servlet default spills to disk at 0B) to match reactive's in-memory handling.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=10MB

# Tomcat thread/connection pooling left at Spring Boot defaults (max-threads=200,
# max-connections=8192, accept-count=100). The async servlet releases Tomcat
# threads during blocking work, so the defaults cycle fine under load.

# Resilience4j rate limiter — mirrors reactive/user-service config so both stacks
# have the same prod-mode resilience surface. @RateLimiter on
# AuthenticationService.register references the 'userServiceRateLimiter' instance.
# Benchmark mode neutralizes it via the configs.default override (unbounded limit-for-period).
resilience4j.ratelimiter.configs.default.limitForPeriod=10
resilience4j.ratelimiter.configs.default.limitRefreshPeriod=1s
resilience4j.ratelimiter.configs.default.timeoutDuration=500ms
resilience4j.ratelimiter.instances.userServiceRateLimiter.baseConfig=default

# Resilience4j inter-service client guards (W6). CircuitBreaker + Retry(backoff) +
# Bulkhead + TimeLimiter wrap every UserClient/TweetClient/InteractionClient call,
# identical async <-> reactive. One instance per client class. Benchmark mode flips
# every aspect off (see application-benchmark.properties), so cost on the measured
# path is provably zero.
management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=100
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=10
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
# Treat business-domain "not found" as terminal: it must not count toward the failure rate or trip the breaker (matches the retry ignoreExceptions).
resilience4j.circuitbreaker.configs.default.ignoreExceptions=ro.tweebyte.userservice.exception.UserNotFoundException
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.tweetClient.baseConfig=default
resilience4j.circuitbreaker.instances.interactionClient.baseConfig=default
# Retry: 3 attempts, 200ms base with exponential backoff (x2). 5xx/transport faults
# retry; the domain not-found (UserNotFoundException) is ignored so 4xx never retries.
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=200ms
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2
resilience4j.retry.configs.default.retryExceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.configs.default.ignoreExceptions=ro.tweebyte.userservice.exception.UserNotFoundException
resilience4j.retry.instances.tweetClient.baseConfig=default
resilience4j.retry.instances.interactionClient.baseConfig=default
# Bulkhead: 200 concurrent calls, 45s acquire wait — symmetric with the 200 HTTP
# pool + 45s acquire timeout.
resilience4j.bulkhead.configs.default.maxConcurrentCalls=200
resilience4j.bulkhead.configs.default.maxWaitDuration=45s
resilience4j.bulkhead.instances.tweetClient.baseConfig=default
resilience4j.bulkhead.instances.interactionClient.baseConfig=default
# TimeLimiter: 45s ceiling, cancel the running future on timeout.
resilience4j.timelimiter.configs.default.timeoutDuration=45s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true
resilience4j.timelimiter.instances.tweetClient.baseConfig=default
resilience4j.timelimiter.instances.interactionClient.baseConfig=default

# Media cache janitor — MediaCacheCleanupService prunes the in-memory MediaCache
# to its most-recently-used entries so the process-local blob store stays bounded
# in a long-lived deployment. Mirrors interaction-service's app.cleanup.* contract:
# single scheduler thread, 24h initial delay so it never fires mid-benchmark, and
# disabled outright in the benchmark profile (app.cleanup.enabled=false).
app.cleanup.scheduler.pool-size=1
app.cleanup.scheduler.initial-delay-hours=24
app.cleanup.media-cache.period-hours=1
app.cleanup.media.max-entries=10
# StaleMediaCleanupService GC floor — a media_assets row is a deletion candidate
# only once it is both unreferenced across all three DBs AND older than this many
# days, giving the two-step upload→attach client flow a grace window. The default-
# avatar sentinel is hard-excluded regardless of age.
app.cleanup.stale-media.period-hours=1
app.cleanup.media.stale-after-days=30

management.endpoints.web.exposure.include=prometheus,health,info
# Actuator basic-auth credential (prod / functional-equivalence only). The password
# is supplied by Vault (secret/tweebyte); the benchmark profile excludes Spring
# Security entirely, so this credential is never consulted on the measured path.
app.actuator.username=${ACTUATOR_USERNAME:actuator}
spring.application.name=user-service
# Distributed tracing: profile-gated (not env-gated). ON in prod / functional-equivalence;
# the benchmark overlay flips it to false so the measured path carries zero span overhead.
management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# OpenAPI / Swagger UI — on in prod & functional-equivalence; the benchmark overlay
# turns it off (off the measured path). Spec build is on-demand, not at boot.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
