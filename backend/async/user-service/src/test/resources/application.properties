# W1 Vault: disabled for unit tests; these resources shadow the main file (no
# vault:// import) and carry the secret values inline so the context boots without Vault.
spring.cloud.vault.enabled=false

# Server configuration — the full-context main() boot test exercises SpringApplication.run,
# which binds a real port; port 0 picks a random free one so it never collides with a
# running stack (Boot's 8080 default hits the gateway container). Mirrors the reactive shadow.
server.port=0

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.tweet.base-url=http://localhost:9092
app.interaction.base-url=http://localhost:9093

# W2 Keycloak: enabled so the @SpringBootTest context wires KeycloakClient +
# AuthenticationService. The client only builds a RestClient at boot — no network call
# until a token is issued — so these placeholders are all the context needs to start.
app.keycloak.enabled=true
app.keycloak.base-url=http://localhost:8090
app.keycloak.realm=tweebyte
app.keycloak.client-id=tweebyte-app
app.keycloak.client-secret=test-secret

# Mirrors the main actuator credential so ActuatorSecurityConfig's @Value placeholders
# resolve under @SpringBootTest (test resources fully shadow the main properties file).
app.actuator.username=actuator
app.actuator.password=changeme-actuator

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# W7: tests run on in-memory H2; the Postgres-specific V1 baseline (BYTEA/decode) would
# fail there, so Flyway is disabled and the H2 schema stays as the tests configure it.
spring.flyway.enabled=false
