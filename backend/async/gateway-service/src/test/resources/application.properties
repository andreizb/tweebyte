# W1 Vault: disabled for unit tests; these resources shadow the main file (no
# vault:// import) and carry the secret values inline so the context boots without Vault.
spring.cloud.vault.enabled=false

# Server Configuration
spring.application.name=gateway-service
server.port=${SERVER_PORT:8080}

# Spring Cloud Gateway Server MVC route targets (env-var overridable, mirroring main).
app.gateway.user-service-uri=${USER_SERVICE_URL:http://localhost:9091/}
app.gateway.tweet-service-uri=${TWEET_SERVICE_URL:http://localhost:9092/}
app.gateway.interaction-service-uri=${INTERACTION_SERVICE_URL:http://localhost:9093/}

# Edge rate limit + CORS knobs (mirroring main) so the route/CORS beans wire under test.
app.gateway.rate-limit.capacity=400
app.gateway.rate-limit.refill-tokens=200
app.gateway.rate-limit.refill-period-seconds=1
app.gateway.cors.allowed-origins=

# W2 Keycloak: the JwkProvider bean is built from jwks-uri (a syntactically valid URL is
# all that is needed at context load — no network call until a token is verified, and the
# integration tests replace the provider with a mock). issuer-uri is the value the filter
# asserts on each verified token.
app.keycloak.issuer-uri=http://localhost:8090/realms/tweebyte
app.keycloak.jwks-uri=http://localhost:8090/realms/tweebyte/protocol/openid-connect/certs
