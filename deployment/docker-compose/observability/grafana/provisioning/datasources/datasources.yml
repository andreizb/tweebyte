# Grafana datasource provisioning for the benchmark observability stack.
# Wires metrics (Prometheus), logs (Loki), and traces (Jaeger) so the
# dashboards have all three signals available without manual setup.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
