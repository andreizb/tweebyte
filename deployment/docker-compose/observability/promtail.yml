# Promtail config: discover Docker containers via the daemon socket and ship
# their logs to Loki.
#
# NOTE: the async/reactive benchmark services are host-run Java processes, NOT
# containers, so Promtail only captures the INFRA containers' logs here
# (Postgres, Redis, gateways if containerized, etc.). Shipping host-process
# logs to Loki would require either containerizing those services or adding a
# Loki appender to the services themselves — that is intentionally NOT done now.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
